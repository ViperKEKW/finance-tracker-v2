[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = core errors, I = import order, B = bugbear (real bug patterns), S = bandit security rules
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of tests; S101 flags it in production code only.
# S105/S106 flag hardcoded password strings. In tests those literals ARE the
# fixture — there is no credential to leak — so the finding is a false positive
# here and a real one anywhere else. Scoped to tests/ rather than disabled
# globally, so a hardcoded password in app/ still fails the build.
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
