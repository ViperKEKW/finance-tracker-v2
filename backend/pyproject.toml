[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F = core errors, I = import order, B = bugbear (real bug patterns), S = bandit security rules
select = ["E", "F", "I", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of tests; S101 flags it in production code only
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
